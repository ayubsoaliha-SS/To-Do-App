<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>
  <h1>todos</h1>
  <form id="form">
    <input type="text" id="input" placeholder="Enter your todo" autocomplete="off">
  </form>
  <ul id="todos"></ul>
  <small>Left click to toggle completed.<br>Right click to delete.<br>Double click to edit.</small>
  
  <script src="script.js"></script>
</body>
</html>
